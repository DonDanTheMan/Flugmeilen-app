name: Supabase Keep Alive

on:
  schedule:
    # Läuft automatisch jeden Tag um 04:00 Uhr UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Erlaubt manuelles Ausführen im GitHub Actions Tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Write keep-alive entry to Supabase
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          STATUS_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            'https://uluqbxlrjakvmeptbphs.supabase.co/rest/v1/keepalive' \
            -H 'apikey: ${{ secrets.SUPABASE_ANON_KEY }}' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}' \
            -H 'Content-Type: application/json' \
            -H 'Prefer: resolution=merge-duplicates' \
            -d "{\"id\": 1, \"pinged_at\": \"$NOW\"}")

          echo "Response Body:"
          cat /tmp/response.json
          echo ""
          echo "Status Code: $STATUS_CODE"

          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 201 ]; then
            echo "✅ Eintrag erfolgreich geschrieben, Supabase aktiv gehalten!"
          else
            echo "⚠️ Unerwarteter Status Code: $STATUS_CODE"
            exit 1
          fi
